<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="760" rx="32" fill="#F8FAFC"/>
  <text x="90" y="94" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">How It Works</text>
  <text x="90" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">A Windows-native Claude Code + Chrome automation flow</text>

  <rect x="90" y="182" width="300" height="170" rx="24" fill="#DBEAFE"/>
  <text x="122" y="236" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Step 1</text>
  <text x="122" y="286" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Launch Script</text>
  <text x="122" y="332" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Double-click `launch-limited.bat`</text>
  <text x="122" y="362" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">or `launch-full-auto.bat`</text>

  <rect x="490" y="182" width="300" height="170" rx="24" fill="#E0F2FE"/>
  <text x="522" y="236" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Step 2</text>
  <text x="522" y="286" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Start Chrome</text>
  <text x="522" y="332" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Dedicated profile +</text>
  <text x="522" y="362" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Remote debugging on 9222</text>

  <rect x="890" y="182" width="300" height="170" rx="24" fill="#EDE9FE"/>
  <text x="922" y="236" fill="#6D28D9" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Step 3</text>
  <text x="922" y="286" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Open Claude</text>
  <text x="922" y="332" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Project-local MCP config</text>
  <text x="922" y="362" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">connects Claude to Chrome</text>

  <path d="M390 267H470" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
  <path d="M790 267H870" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
  <path d="M456 247L476 267L456 287" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M856 247L876 267L856 287" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="90" y="438" width="528" height="212" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="124" y="490" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Limited Mode</text>
  <text x="124" y="536" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Best for everyday browsing, scraping, clicking, and screenshots.</text>
  <text x="124" y="574" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Allows browser automation while denying `Bash` and `WebFetch`.</text>
  <rect x="124" y="602" width="150" height="30" rx="15" fill="#DBEAFE"/>
  <text x="199" y="622" text-anchor="middle" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">safer default</text>

  <rect x="662" y="438" width="528" height="212" rx="24" fill="#0F172A"/>
  <text x="696" y="490" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Full-Auto Mode</text>
  <text x="696" y="536" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Best for high-trust tasks where you want Claude to ask less.</text>
  <text x="696" y="574" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Launches Claude Code with `--dangerously-skip-permissions`.</text>
  <rect x="696" y="602" width="190" height="30" rx="15" fill="#1D4ED8"/>
  <text x="791" y="622" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">high autonomy</text>
</svg>
